services:
  backend:
    build:
      context: ./backend
      args:
        MODEL_DIR: ${FORTEXA_MODEL_DIR:-runs/general-ai-trained-indoor-20261005}
    container_name: fortexa-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - FRONTEND_ORIGIN=http://localhost:3000
      # Required: set SECRET_KEY in your shell or the project-root .env.
      - SECRET_KEY=${SECRET_KEY:?Set a random SECRET_KEY of at least 32 characters}
      - DATABASE_URL=${DATABASE_URL:?Set your Neon PostgreSQL connection string in the shell or project-root .env}
    volumes:
      - fortexa_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: fortexa-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  fortexa_data:
