services:
  backend:
    build: ./backend
    container_name: fortexa-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - FRONTEND_ORIGIN=http://localhost:3000
      # Optional: set a strong secret for production
      - SECRET_KEY=change-me-fortexa-secret
    volumes:
      - fortexa_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    container_name: fortexa-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  fortexa_data:
